# =============================================================
# ReliefLink API — Application Configuration
# =============================================================
# Environment variables map directly from the existing .env file:
#   DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, DB_PORT
#   JWT_SECRET, JWT_EXPIRES_IN
#   FRONTEND_URL, PORT
# =============================================================

# --- Datasource (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:drrms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Database Initialization ---
spring.sql.init.mode=never

# --- JWT ---
app.jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-that-is-at-least-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- CORS ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# --- Server ---
server.port=${PORT:8080}
server.servlet.context-path=/api

# --- Jackson ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
